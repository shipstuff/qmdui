apiVersion: batch/v1
kind: Job
metadata:
  name: qmdui-seed
  namespace: open-webui
  labels:
    app: qmdui
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: qmdui-seed
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: sf-west-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seed
          image: registry.local:30500/shipstuff/qmdui:latest
          imagePullPolicy: Always
          command:
            - dumb-init
            - node
            - dist/seed.js
          envFrom:
            - configMapRef:
                name: qmdui-config
            - secretRef:
                name: qmdui-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qmdui-data
        - name: tmp
          emptyDir: {}
