apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qmdui
  namespace: open-webui
  labels:
    app: qmdui
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
    - host: qmdui.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qmdui
                port:
                  name: http
