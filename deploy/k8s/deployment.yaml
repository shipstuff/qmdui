apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmdui
  namespace: open-webui
  labels:
    app: qmdui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qmdui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qmdui
    spec:
      nodeSelector:
        kubernetes.io/hostname: sf-west-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: registry.local:30500/shipstuff/qmdui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: qmdui-config
            - secretRef:
                name: qmdui-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qmdui-data
        - name: tmp
          emptyDir: {}
